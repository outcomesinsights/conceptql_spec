---
# The database README.md's results and counts are generated from: ConceptQL's
# test data, the same image and Postgres settings as the test_data service in
# ConceptQL's docker-compose.yml.  Published on loopback only, so that .env can
# name an address that does not move (see .env.example and Appendix D of
# README.cql.md).
services:
  test_data:
    image: outcomesinsights/misc:test_data.ignitor
    command: -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c work_mem=4GB -c shared_buffers=6GB -c effective_cache_size=6GB -c max_parallel_workers_per_gather=0
    shm_size: 6g
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ryan -d test_data"]
      interval: 2s
      timeout: 5s
      retries: 60
